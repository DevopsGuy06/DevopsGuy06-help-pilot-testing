<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Neomax Help – Secure Pilot V2</title>

<style>
body{
    font-family:system-ui,sans-serif;
    margin:0;
    background:#f4f6f8;
    color:#17202a
}

header{
    background:#153b5b;
    color:white;
    padding:20px
}

main{
    max-width:760px;
    margin:auto;
    padding:18px
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    margin:14px 0;
    box-shadow:0 2px 10px #0001
}

input,button{
    font-size:18px;
    padding:13px;
    border-radius:10px;
    width:100%;
    box-sizing:border-box
}

input{
    border:1px solid #ccd3da
}

button{
    border:0;
    background:#153b5b;
    color:white;
    margin-top:10px
}

.badge{
    display:inline-block;
    padding:7px 10px;
    border-radius:20px;
    margin:4px;
    font-weight:600
}

.green{
    background:#d9f7df
}

.yellow{
    background:#fff1bd
}

.gray{
    background:#e8ecef
}

.red{
    background:#ffd9d9
}

.small{
    font-size:13px;
    color:#5f6b75
}

.hidden{
    display:none
}

.error{
    color:#a40000;
    font-weight:600
}

.success{
    color:#176b2c;
    font-weight:600
}
</style>
</head>

<body>

<header>
    <h2>🏠 Neomax Help</h2>
    <div>என் Neomax நிலை — Secure Pilot V2</div>
</header>

<main>

<!-- LOGIN / OTP -->

<div id="login" class="card">

    <h3>🔐 OTP Verification</h3>

    <p>
        உங்கள் Depositor Number-ஐ உள்ளிடுங்கள்.
    </p>

    <input
        id="no"
        placeholder="உதா: PILOT1001"
        autocomplete="off"
    >

    <button onclick="requestOtp()">
        OTP அனுப்பவும்
    </button>

    <div id="otpbox" class="hidden">

        <p id="mobile"></p>

        <input
            id="otp"
            inputmode="numeric"
            maxlength="6"
            placeholder="6-digit OTP"
        >

        <button onclick="verifyOtp()">
            OTP Verify
        </button>

        <p class="small">
            🧪 Pilot testing OTP:
            <b>123456</b>
        </p>

    </div>

    <p id="msg"></p>

</div>


<!-- RESULT -->

<div id="result" class="hidden">

    <div class="card">

        <h3 id="title"></h3>

        <div id="summary"></div>

        <button onclick="logout()">
            🚪 Logout
        </button>

    </div>


    <!-- MONEY -->

    <div class="card">

        <h3>💰 என் பணம்</h3>

        <div id="money"></div>

    </div>


    <!-- DOCUMENTS -->

    <div class="card">

        <h3>📄 Documents / Entries</h3>

        <div id="records"></div>

    </div>


    <!-- COMPLAINT -->

    <div class="card">

        <h3>⚖️ Complaint</h3>

        <span class="badge gray">
            ⚪ Pilot-ல் இன்னும் இணைக்கப்படவில்லை
        </span>

    </div>


    <!-- ACTION -->

    <div class="card">

        <h3>❓ என்ன செய்ய வேண்டும்?</h3>

        <div id="action"></div>

    </div>

</div>

</main>


<script>

let currentDepositor = "";


/* -------------------------
   REQUEST OTP
------------------------- */

async function requestOtp(){

    currentDepositor =
        document.getElementById("no")
        .value
        .trim()
        .toUpperCase();

    if(!currentDepositor){

        showMessage(
            "Depositor Number உள்ளிடுங்கள்",
            true
        );

        return;
    }

    try{

        const response =
            await fetch(
                "/api/request-otp",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        depositor_no:
                        currentDepositor
                    })
                }
            );

        const data =
            await response.json();


        if(!response.ok){

            showMessage(
                data.error ||
                "OTP request failed",
                true
            );

            return;
        }


        document
            .getElementById("otpbox")
            .classList
            .remove("hidden");


        if(data.masked_mobile){

            document
                .getElementById("mobile")
                .textContent =
                "OTP அனுப்பப்பட்ட Mobile: "
                + data.masked_mobile;

        }else{

            document
                .getElementById("mobile")
                .textContent =
                "If registered, OTP request created.";

        }


        showMessage(
            data.message ||
            "OTP request created"
        );

    }catch(error){

        showMessage(
            "Server connection error",
            true
        );

    }

}


/* -------------------------
   VERIFY OTP
------------------------- */

async function verifyOtp(){

    const code =
        document
        .getElementById("otp")
        .value
        .trim();


    if(!code){

        showMessage(
            "OTP உள்ளிடுங்கள்",
            true
        );

        return;
    }


    try{

        const response =
            await fetch(
                "/api/verify-otp",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        depositor_no:
                        currentDepositor,

                        otp:code

                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            showMessage(
                data.error ||
                "OTP verification failed",
                true
            );

            return;
        }


        document
            .getElementById("login")
            .classList
            .add("hidden");


        await loadData();

    }catch(error){

        showMessage(
            "Server connection error",
            true
        );

    }

}


/* -------------------------
   LOAD AUTHORIZED DATA
------------------------- */

async function loadData(){

    try{

        const response =
            await fetch(
                "/api/depositor/"
                +
                encodeURIComponent(
                    currentDepositor
                )
            );


        const data =
            await response.json();


        if(!response.ok){

            document
                .getElementById("login")
                .classList
                .remove("hidden");

            showMessage(
                data.error ||
                "Unauthorized",
                true
            );

            return;
        }


        document
            .getElementById("result")
            .classList
            .remove("hidden");


        document
            .getElementById("title")
            .textContent =
            "Depositor "
            + data.depositor_no;


        document
            .getElementById("summary")
            .innerHTML =

            "<p><b>"
            + data.name
            + "</b></p>"

            +

            "<p>Mobile: "
            + data.mobile
            + "</p>"

            +

            "<span class='badge green'>"
            + "🟢 "
            + (data.status_counts[
                "Accepted Entry"
            ] || 0)
            + " Accepted"
            + "</span>"

            +

            "<span class='badge yellow'>"
            + "🟡 "
            + (data.status_counts[
                "Unconfirmed Entries"
            ] || 0)
            + " Unconfirmed"
            + "</span>";


        document
            .getElementById("money")
            .innerHTML =

            "<h2>₹"
            + data.total
                .toLocaleString("en-IN")
            + "</h2>"

            +

            "<p>"
            + data.record_count
            + " record(s)"
            + "</p>";


        document
            .getElementById("records")
            .innerHTML =

            data.records
            .map(function(x){

                return

                "<div class='card'>"

                +

                "<b>"
                + x.receipt
                + "</b> · "
                + x.company

                +

                "<br>₹"
                + x.amount
                    .toLocaleString("en-IN")

                + " · "
                + x.date

                +

                "<br>"

                +

                "<span class='badge "
                +

                (
                    x.status ===
                    "Accepted Entry"
                    ?
                    "green"
                    :
                    "yellow"
                )

                +

                "'>"

                + x.status

                + "</span>"

                +

                "</div>";

            })
            .join("");


        const hasUnconfirmed =
            data.records.some(
                function(x){

                    return x.status !==
                        "Accepted Entry";

                }
            );


        if(hasUnconfirmed){

            document
                .getElementById("action")
                .innerHTML =

                "<span class='badge yellow'>"
                + "🟡 Verification தேவை"
                + "</span>"

                +

                "<p>"
                + "Unconfirmed entry இருப்பதால் "
                + "source document-ஐ வைத்து "
                + "சரிபார்க்க வேண்டும்."
                + "</p>";

        }else{

            document
                .getElementById("action")
                .innerHTML =

                "<span class='badge green'>"
                + "🟢 இப்போது action தேவையில்லை"
                + "</span>";

        }

    }catch(error){

        showMessage(
            "Unable to load data",
            true
        );

    }

}


/* -------------------------
   LOGOUT
------------------------- */

async function logout(){

    await fetch(
        "/api/logout",
        {
            method:"POST"
        }
    );

    location.reload();

}


/* -------------------------
   MESSAGE
------------------------- */

function showMessage(
    message,
    isError=false
){

    const element =
        document.getElementById("msg");

    element.textContent =
        message;

    element.className =
        isError
        ? "error"
        : "success";

}

</script>

</body>
 </html>
