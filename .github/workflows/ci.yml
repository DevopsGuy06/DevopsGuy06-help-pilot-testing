name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install scanners
        run: pip install bandit pip-audit

      - name: Bandit (code scan)
        run: bandit -r app.py

      - name: pip-audit (dependency scan)
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t neomax-help:ci .

      - name: Run container
        run: >
          docker run -d --name app -p 8000:8000
          -e ADMIN_USERNAME=ci
          -e ADMIN_PASSWORD=ci-test-pass
          -e SECRET_KEY=ci-test-key
          neomax-help:ci

      - name: Smoke test
        run: |
          sleep 5
          curl --fail http://localhost:8000/api/health

      - name: Show logs on failure
        if: failure()
        run: docker logs app